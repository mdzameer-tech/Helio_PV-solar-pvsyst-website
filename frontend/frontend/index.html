<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar String Monitor</title>
<style>
  body { font-family: system-ui, sans-serif; background: #10141a; color: #eee; margin: 0; padding: 24px; text-align: center; }
  h1 { margin-bottom: 4px; }
  #gateway { font-size: 14px; margin-bottom: 16px; }
  #alert { display: none; background: #e74c3c; color: #fff; padding: 14px; border-radius: 10px; margin: 0 auto 24px; max-width: 700px; font-weight: 600; }
  .string { display: flex; align-items: center; justify-content: center; gap: 0; flex-wrap: wrap; }
  .wire { width: 40px; height: 6px; background: #555; }
  .wire.bad { background: #e74c3c; }
  .cell {
    width: 190px; padding: 18px; border-radius: 12px; border: 3px solid #000;
    background-image: linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px);
    background-size: 24px 24px; transition: background-color .3s;
  }
  .ok { background-color: #1f8f4e; }
  .broken { background-color: #c0392b; animation: pulse 1s infinite; }
  .low_voltage { background-color: #d68910; }
  .no_signal { background-color: #555; }
  @keyframes pulse { 50% { opacity: .65; } }
  .cell h2 { margin: 0 0 6px; }
  .badge { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
  .vals { margin-top: 10px; font-size: 15px; line-height: 1.6; }
  .note { font-size: 12px; margin-top: 8px; opacity: .9; }
</style>
</head>
<body>
  <h1>Solar String Monitor</h1>
  <div id="gateway">Connecting...</div>
  <div id="alert"></div>
  <div class="string" id="string"></div>

<script>
const API = "http://localhost:3000/api/status";

const LABEL = {
  ok: "CONNECTED", broken: "DISCONNECTED",
  low_voltage: "LOW VOLTAGE", no_signal: "NO SIGNAL"
};
const NOTE = {
  broken: "Open circuit detected in this cell's string segment.",
  low_voltage: "Cell is connected but voltage is below threshold.",
  no_signal: "No data from this node (radio link lost or node off)."
};

function render(data) {
  const gw = document.getElementById("gateway");
  gw.textContent = data.gatewayOnline ? "ESP32 gateway: online" : "ESP32 gateway: OFFLINE";
  gw.style.color = data.gatewayOnline ? "#2ecc71" : "#e74c3c";

  const broken = data.cells.filter(c => c.state === "broken");
  const lost = data.cells.filter(c => c.state === "no_signal");
  const alert = document.getElementById("alert");
  if (broken.length) {
    alert.style.display = "block";
    alert.style.background = "#e74c3c";
    alert.textContent = "⚠ Disconnection in string: Cell " + broken.map(c => c.id).join(", ") +
      ". Cells wired in series, so the whole string output is affected.";
  } else if (lost.length) {
    alert.style.display = "block";
    alert.style.background = "#777";
    alert.textContent = "No signal from Cell " + lost.map(c => c.id).join(", ");
  } else {
    alert.style.display = "none";
  }

  const el = document.getElementById("string");
  el.innerHTML = data.cells.map((c, i) => {
    const wire = i < data.cells.length - 1
      ? `<div class="wire ${c.state === "broken" ? "bad" : ""}"></div>` : "";
    const vals = c.voltage === null ? "—" :
      `Voltage: ${c.voltage.toFixed(2)} V<br>Current: ${c.current.toFixed(3)} A<br>Power: ${c.power.toFixed(2)} W`;
    return `
      <div class="cell ${c.state}">
        <h2>Cell ${c.id}</h2>
        <div class="badge">${LABEL[c.state]}</div>
        <div class="vals">${vals}</div>
        ${NOTE[c.state] ? `<div class="note">${NOTE[c.state]}</div>` : ""}
      </div>${wire}`;
  }).join("");
}

async function poll() {
  try {
    const r = await fetch(API);
    render(await r.json());
  } catch (e) {
    document.getElementById("gateway").textContent = "Backend unreachable";
    document.getElementById("gateway").style.color = "#e74c3c";
  }
}
setInterval(poll, 500);
poll();
</script>
</body>
</html>
